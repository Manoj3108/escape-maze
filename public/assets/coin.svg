<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40">
    <!-- Transparent background so the floor shows through -->
    <rect width="40" height="40" fill="none"/>
    
    <!-- Outer bright yellow ring -->
    <circle cx="20" cy="20" r="16" fill="none" stroke="#ffff00" stroke-width="2"/>
    
    <!-- Inner geometric diamond -->
    <polygon points="20,10 26,20 20,30 14,20" fill="none" stroke="#ffff00" stroke-width="2"/>
    
    <!-- Center energy dot -->
    <circle cx="20" cy="20" r="2" fill="#ffff00"/>
</svg>
