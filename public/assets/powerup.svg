<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffcc" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0a0a14" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="50" cy="50" r="45" fill="url(#glow)" />
  
  <!-- Outer Diamond Frame -->
  <polygon points="50,10 90,50 50,90 10,50" fill="#1a1a2e" stroke="#00ffcc" stroke-width="4" />
  
  <!-- Inner Star / Power Core Symbol -->
  <polygon points="50,25 60,40 75,40 62,52 68,68 50,58 32,68 38,52 25,40 40,40" fill="#00ffcc" />
</svg>
