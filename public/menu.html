<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<title>Escape Hidden Exit</title>

<style>

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#111,#222,#333);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    color:white;
}

.box{
    width:420px;
    background:#1f1f1f;
    padding:40px;
    border-radius:18px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,255,150,.3);
}

h1{
    font-size:42px;
    margin-bottom:10px;
}

p{
    color:#ccc;
    margin-bottom:25px;
}

input{
    width:100%;
    padding:14px;
    margin-top:15px;
    font-size:18px;
    border:none;
    border-radius:8px;
    text-align:center;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:15px;
    margin-top:15px;
    font-size:20px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    transition:.3s;
}

#createBtn{
    background:#00b894;
    color:white;
}

#createBtn:hover{
    background:#00d68f;
}

#joinBtn{
    background:#0984e3;
    color:white;
}

#joinBtn:hover{
    background:#1aa1ff;
}

#status{
    margin-top:20px;
    color:#ffd54f;
}

</style>

</head>

<body>

<div class="box">

    <h1>Escape Hidden Exit</h1>

    <p>Collect the key and escape before the timer ends.</p>

    <input
        type="text"
        id="playerName"
        placeholder="Enter Your Name"
    >

    <button id="createBtn">
        🎮 Create Room
    </button>

    <input
        type="text"
        id="roomCode"
        placeholder="Enter Room Code"
        maxlength="6"
    >

    <button id="joinBtn">
        👥 Join Room
    </button>

    <div id="status"></div>

</div>

<script>

document.getElementById("createBtn").onclick=function(){

    let name=document.getElementById("playerName").value.trim();

    if(name===""){
        alert("Please enter your name");
        return;
    }

    localStorage.setItem("playerName",name);

    window.location="index.html?host=1";

};

document.getElementById("joinBtn").onclick=function(){

    let name=document.getElementById("playerName").value.trim();
    let code=document.getElementById("roomCode").value.trim().toUpperCase();

    if(name===""){
        alert("Please enter your name");
        return;
    }

    if(code===""){
        alert("Enter Room Code");
        return;
    }

    localStorage.setItem("playerName",name);

    window.location="index.html?room="+code;

};

</script>

</body>
</html>
